name: Slides

# Re-print the presentation PDF whenever the deck changes.
#
#   push to main            → rebuild, verify, upload the PDF as an artifact
#   push a tag `slides-v*`  → rebuild, verify, publish a GitHub Release
#
# There is deliberately no `paths:` filter on `push`. GitHub requires the
# branch/tag filter AND the path filter to match, so `paths` here would mean a
# `slides-v*` tag that happens not to touch slides/** never releases — and
# "pushed a tag, got no release" is the worst kind of silent failure. The
# build is under a minute; running it on every push to main is the cheaper
# trade. Same reasoning as release-live-demo.yml.
#
# Pull requests do filter on paths: there is no release at stake there.
on:
  push:
    branches: [main]
    tags: ["slides-v*"]
  pull_request:
    paths:
      - "slides/**"
      - ".github/workflows/slides.yml"
  workflow_dispatch:

concurrency:
  group: slides-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed by the release step; harmless on ordinary pushes.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Marp drives headless Chrome; poppler gives us pdftoppm for the
      # overflow check, and Pillow reads the rasterised slides.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            chromium-browser poppler-utils fonts-noto-cjk || \
          sudo apt-get install -y --no-install-recommends \
            chromium poppler-utils fonts-noto-cjk
          python3 -m pip install --quiet Pillow

      - name: Resolve Chrome binary
        id: chrome
        run: |
          # Existing on PATH is not enough: on Ubuntu `chromium-browser` is
          # often a snap wrapper that resolves fine and then fails to launch,
          # which surfaces from Marp only as "Failed to launch the browser
          # process". Ask each candidate for its version and take the first
          # that actually answers.
          for c in chromium google-chrome chromium-browser; do
            p="$(command -v "$c" 2>/dev/null)" || continue
            if v="$("$p" --version 2>/dev/null)"; then
              echo "using $p ($v)"
              echo "path=$p" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "$p exists but will not run; trying the next"
          done
          echo "No usable Chromium binary found" >&2; exit 1

      - name: Resolve version
        id: v
        run: |
          # `version` names the artifact; `display` titles the release, with the
          # `slides-` prefix stripped so it does not read "Slides slides-v1".
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
            display="${GITHUB_REF_NAME#slides-}"
            is_release=true
          else
            version="main-$(git rev-parse --short HEAD)"
            display="${version}"
            is_release=false
          fi
          {
            echo "version=${version}"
            echo "display=${display}"
            echo "is_release=${is_release}"
          } >> "$GITHUB_OUTPUT"

      # Three decks: the 12-slide talk, the same with recorded terminal
      # captures as a demo fallback, and the 43-slide reference edition.
      - name: Build the PDFs
        working-directory: slides
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
          # Marp's bundled Chromium needs the sandbox off inside the runner.
          CHROME_ENABLE_EXTENSIONS: "false"
        run: |
          mkdir -p dist
          for d in deck deck-backup deck-full; do
            npx --yes @marp-team/marp-cli@4.0.0 "$d.md" \
              --config .marprc.yml --pdf --no-sandbox \
              -o "dist/imbrave150-$d.pdf"
          done
          ls -la dist/

      # Marp clips a too-full slide without saying a word. Rasterise the
      # artefact we are about to ship and assert nothing was cut off.
      - name: Verify no slide overflows
        working-directory: slides
        run: |
          mkdir -p dist/png
          for d in deck deck-backup deck-full; do
            pdftoppm -png -r 96 "dist/imbrave150-$d.pdf" "dist/png/$d"
          done
          python3 tools/check_overflow.py dist/png

      - name: Report deck size
        working-directory: slides
        run: |
          slides=$(find dist/png -name '*.png' | wc -l | tr -d ' ')
          {
            echo "### Slides rebuilt"
            echo ""
            echo "- version: \`${{ steps.v.outputs.version }}\`"
            echo "- slides: ${slides}"
            echo "- decks: $(find dist -maxdepth 1 -name '*.pdf' | wc -l | tr -d ' ')"
          } >> "$GITHUB_STEP_SUMMARY"

      # One zip the presenter can carry: the running order, the offline player
      # and the three PDFs. The player is committed already — it is a single
      # self-contained HTML file — so CI only assembles, it does not re-record.
      - name: Build the presenter bundle
        # `display` already has the `slides-` tag prefix stripped, so the zip is
        # imbrave150-slides-v2.2.0.zip rather than …-slides-slides-v2.2.0.zip.
        run: ./scripts/make-slides-bundle.sh "${{ steps.v.outputs.display }}"

      - name: Upload the PDFs and the bundle
        uses: actions/upload-artifact@v4
        with:
          name: imbrave150-slides-${{ steps.v.outputs.version }}
          path: |
            slides/dist/*.pdf
            dist/imbrave150-slides-*.zip
          if-no-files-found: error

      - name: Publish release
        if: steps.v.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: "Slides ${{ steps.v.outputs.display }}"
          files: |
            slides/dist/*.pdf
            dist/imbrave150-slides-*.zip
          body: |
            A talk about doing a whole study — ten messy hospital exports to a
            written-up manuscript — by asking an AI agent in plain sentences,
            and checking everything it hands back.

            ## Presenting it

            1. **Download `imbrave150-slides-*.zip` and unzip it.** That is
               everything. No clone, no network, no toolchain — it runs on a
               borrowed laptop.
            2. **Read `SPEAKER-NOTES.md` first** (Chinese). The slides are in
               English and the delivery is not; those notes are the bridge. They
               give you what to say for the opening slides and at each of the
               five stops.
            3. **Open `deck.pdf`** and present the first five slides — about ten
               minutes. The fourth one explains what a terminal is; do not skip
               it if the room has never seen one.
            4. **Open `talk.html`** and play. It opens at 1.5×, where the
               recording runs 22 minutes. Stop five times, roughly one minute
               each, at the points the notes mark.
            5. **Close on the last two slides of `deck.pdf`** — about ten
               minutes with discussion.

            That is a 45-minute slot: 10 speaking, 25 playing and stopping,
            10 closing.

            ### While it is playing

            The bar across the top has speed (1× to 3×), a chapter dropdown,
            play/pause and fullscreen. Three things are there for the room:

            - **A chapter side pane** — the `☰` button, or `c`. All twenty-two
              chapters listed, the current one highlighted, click to jump. The
              page shifts left so it never covers the terminal. Use `f` for
              fullscreen: that expands the whole page, so the pane survives it.
              The player's own fullscreen button expands only the terminal.
            - **Click anywhere to pause.** No hunting for a button.
            - **Select terminal text, then "放大文字".** A popover appears above
              the selection and the chosen lines fill the window at the largest
              size that fits. `Esc` or `×` returns. This is for the back row.

            Drop to 1× for anything you want the room to read; push to 2×
            through the parts where the agent is thinking rather than printing.

            If someone asks something the walkthrough does not cover — how the
            matching works, what happens when a prompt is ambiguous, the 120
            analytic paths, the four reviewers — `talk-long.html` in the same
            folder is the hour-long version with all of it in.

            If the browser fails, `deck-backup.pdf` carries a still frame from
            the recording after each signpost, so you can finish from the PDF.

            ## What is in the zip

            | file | what it is |
            |---|---|
            | `SPEAKER-NOTES.md` | What to say. Read this first. |
            | `talk.html` | The recording. 32:55, or 22 min at 1.5×. Double-click it. |
            | `deck.pdf` | The slides you present around it. |
            | `talk-long.html` | The hour-long version, for questions and for handing out. |
            | `deck-backup.pdf` | The slides with recorded frames in them, if the browser dies. |
            | `deck-reference.pdf` | 43-slide reference edition, for afterwards. |
            | `source/` | The raw recording and its marker log. |

            The three PDFs are attached separately as well, if the zip is more
            than you need.

            Hsieh-Ting Lin, MD (林協霆) · Department of Medical Oncology,
            Koo Foundation Sun Yat-Sen Cancer Center (和信治癌中心醫院).

            Built from `slides/` at ${{ github.sha }}. Every slide was checked
            for overflow before release, every citation was verified against
            Crossref, and every number came from a recorded run of the
            `live-demo/` pipeline in this repository.

            ⚠️ All data are synthetic. No real patient is represented, and
            nothing here is evidence about atezolizumab, bevacizumab or
            sorafenib.
