name: Slides

# Re-print the presentation PDF whenever the deck changes.
#
#   push to main            → rebuild, verify, upload the PDF as an artifact
#   push a tag `slides-v*`  → rebuild, verify, publish a GitHub Release
#
# There is deliberately no `paths:` filter on `push`. GitHub requires the
# branch/tag filter AND the path filter to match, so `paths` here would mean a
# `slides-v*` tag that happens not to touch slides/** never releases — and
# "pushed a tag, got no release" is the worst kind of silent failure. The
# build is under a minute; running it on every push to main is the cheaper
# trade. Same reasoning as release-live-demo.yml.
#
# Pull requests do filter on paths: there is no release at stake there.
on:
  push:
    branches: [main]
    tags: ["slides-v*"]
  pull_request:
    paths:
      - "slides/**"
      - ".github/workflows/slides.yml"
  workflow_dispatch:

concurrency:
  group: slides-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed by the release step; harmless on ordinary pushes.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Marp drives headless Chrome; poppler gives us pdftoppm for the
      # overflow check, and Pillow reads the rasterised slides.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            chromium-browser poppler-utils fonts-noto-cjk || \
          sudo apt-get install -y --no-install-recommends \
            chromium poppler-utils fonts-noto-cjk
          python3 -m pip install --quiet Pillow

      - name: Resolve Chrome binary
        id: chrome
        run: |
          for c in chromium-browser chromium google-chrome; do
            if command -v "$c" >/dev/null 2>&1; then
              echo "path=$(command -v "$c")" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "No Chromium binary found" >&2; exit 1

      - name: Resolve version
        id: v
        run: |
          # `version` names the artifact; `display` titles the release, with the
          # `slides-` prefix stripped so it does not read "Slides slides-v1".
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
            display="${GITHUB_REF_NAME#slides-}"
            is_release=true
          else
            version="main-$(git rev-parse --short HEAD)"
            display="${version}"
            is_release=false
          fi
          {
            echo "version=${version}"
            echo "display=${display}"
            echo "is_release=${is_release}"
          } >> "$GITHUB_OUTPUT"

      # Three decks: the 12-slide talk, the same with recorded terminal
      # captures as a demo fallback, and the 43-slide reference edition.
      - name: Build the PDFs
        working-directory: slides
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
          # Marp's bundled Chromium needs the sandbox off inside the runner.
          CHROME_ENABLE_EXTENSIONS: "false"
        run: |
          mkdir -p dist
          for d in deck deck-backup deck-full; do
            npx --yes @marp-team/marp-cli@4.0.0 "$d.md" \
              --config .marprc.yml --pdf --no-sandbox \
              -o "dist/imbrave150-$d.pdf"
          done
          ls -la dist/

      # Marp clips a too-full slide without saying a word. Rasterise the
      # artefact we are about to ship and assert nothing was cut off.
      - name: Verify no slide overflows
        working-directory: slides
        run: |
          mkdir -p dist/png
          for d in deck deck-backup deck-full; do
            pdftoppm -png -r 96 "dist/imbrave150-$d.pdf" "dist/png/$d"
          done
          python3 tools/check_overflow.py dist/png

      - name: Report deck size
        working-directory: slides
        run: |
          slides=$(find dist/png -name '*.png' | wc -l | tr -d ' ')
          {
            echo "### Slides rebuilt"
            echo ""
            echo "- version: \`${{ steps.v.outputs.version }}\`"
            echo "- slides: ${slides}"
            echo "- decks: $(find dist -maxdepth 1 -name '*.pdf' | wc -l | tr -d ' ')"
          } >> "$GITHUB_STEP_SUMMARY"

      # One zip the presenter can carry: the running order, the offline player
      # and the three PDFs. The player is committed already — it is a single
      # self-contained HTML file — so CI only assembles, it does not re-record.
      - name: Build the presenter bundle
        run: ./scripts/make-slides-bundle.sh "${{ steps.v.outputs.version }}"

      - name: Upload the PDFs and the bundle
        uses: actions/upload-artifact@v4
        with:
          name: imbrave150-slides-${{ steps.v.outputs.version }}
          path: |
            slides/dist/*.pdf
            dist/imbrave150-slides-*.zip
          if-no-files-found: error

      - name: Publish release
        if: steps.v.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: "Slides ${{ steps.v.outputs.display }}"
          files: |
            slides/dist/*.pdf
            dist/imbrave150-slides-*.zip
          body: |
            **Mission by Mission** — driving an AI coding agent, live, from ten
            messy hospital exports to a result you can audit.

            | file | what it is |
            |---|---|
            | `imbrave150-slides-*.zip` | **Start here.** Everything needed to present, offline: the running order, the 64-minute recording as a self-contained player, and all three PDFs. |
            | `imbrave150-deck.pdf` | **The talk.** 12 slides: five signposts around a live demo. |
            | `imbrave150-deck-backup.pdf` | The same, with recorded terminal output after each signpost, for when the demo will not cooperate. |
            | `imbrave150-deck-full.pdf` | Reference edition, 43 slides, for reading afterwards. |

            Hsieh-Ting Lin, MD (林協霆) · Department of Medical Oncology,
            Koo Foundation Sun Yat-Sen Cancer Center (和信治癌中心醫院).

            Built from `slides/` at ${{ github.sha }}. Every slide was checked
            for overflow before release; every citation was verified against
            Crossref; and every number came from a recorded run of the
            `live-demo/` pipeline in this repository.

            ⚠️ All data in the deck are synthetic. No real patient is
            represented, and nothing here is evidence about atezolizumab,
            bevacizumab or sorafenib.
