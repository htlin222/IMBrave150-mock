name: A run did not reproduce
description: Your numbers came out differently, or an acceptance check failed.
title: "[repro] "
labels: ["reproduction"]
body:
  - type: markdown
    attributes:
      value: |
        Agent-driven runs legitimately vary — two runs make different
        defensible choices. [`live-demo/reference-run/`](../../tree/main/live-demo/reference-run)
        says how much variation is expected. What should never vary is the
        direction: the unadjusted hazard ratio is far too flattering, the
        matched one lands near 0.58, and no specification crosses 1.0.

        If yours is off in *direction*, that is a real finding and worth this issue.

  - type: dropdown
    id: route
    attributes:
      label: Which route
      options:
        - "A · guided (live-demo, mission by mission)"
        - "B · the walkthrough prompt list"
        - "C · the long prompt list"
        - "D · the reference scripts (make data && make analyze)"
    validations:
      required: true

  - type: input
    id: mission
    attributes:
      label: Where it went wrong
      description: Mission number, prompt number, or script name.
      placeholder: "Mission 2.3"
    validations:
      required: true

  - type: textarea
    id: verify
    attributes:
      label: Acceptance script output
      description: >-
        Verbatim, please — `cd live-demo && ../.venv/bin/python verify/chNN.py
        --mission N.N`. If you were on route D, paste the script's stdout.
      render: text
    validations:
      required: true

  - type: textarea
    id: numbers
    attributes:
      label: Your numbers next to the reference
      description: >-
        The ones in `live-demo/reference-run/README.md` are the comparison.
      placeholder: |
        matched OS HR:  mine 0.71   reference 0.578
        pairs:          mine 402    reference 706
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: "`.venv/bin/pip freeze` and your OS. Which agent, if any."
      render: text
    validations:
      required: true
